<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 200px;
    height: 220px;
    overflow: hidden;
    background: transparent;
    user-select: none;
    cursor: grab;
    position: relative;
  }
  body:active { cursor: grabbing; }
  canvas {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 128px;
    height: 128px;
    image-rendering: pixelated;
  }

  #name-tag {
    position: absolute;
    bottom: 80px;
    left: 42%;
    transform: translateX(-50%);
    transition: bottom 0.3s ease;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.5);
    font-family: "Microsoft JhengHei", sans-serif;
    white-space: nowrap;
    pointer-events: none;
    z-index: 90;
  }
  .name-char {
    display: inline-block;
    animation: nameCharBob 1.6s ease-in-out infinite, nameCharGlow 1.6s ease-in-out infinite;
  }
  @keyframes nameCharBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes nameCharGlow {
    0%, 100% { color: #ffffff; }
    50% { color: #D97757; }
  }

  #speech {
    position: absolute;
    bottom: 105px;
    left: 42%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.75);
    border-radius: 12px;
    padding: 6px 10px;
    max-width: 180px;
    font-size: 12px;
    color: #ffffff;
    font-family: "Microsoft JhengHei", sans-serif;
    line-height: 1.4;
    white-space: normal;
    word-wrap: break-word;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #speech.visible {
    opacity: 1;
  }
  #speech:after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    margin-left: -8px;
    border-width: 8px 8px 0;
    border-style: solid;
    border-color: rgba(0, 0, 0, 0.75) transparent transparent;
  }

  #usage {
    position: absolute;
    bottom: 65px;
    left: 42%;
    transform: translateX(-50%);
    font-size: 10px;
    font-family: "Consolas", "Courier New", monospace;
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    white-space: nowrap;
    pointer-events: none;
    z-index: 85;
    opacity: 0;
    transition: opacity 0.5s ease, bottom 0.3s ease;
  }
  #usage.visible {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="speech"></div>
<div id="usage"></div>
<canvas id="c" width="128" height="128"></canvas>
<div id="name-tag"></div>
<script>
const { ipcRenderer } = require('electron');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const nameTag = document.getElementById('name-tag');
const speechEl = document.getElementById('speech');
const usageEl = document.getElementById('usage');

// --- Name tag (same style as 芋頭: per-char bob + glow) ---
function renderNameTag(text) {
  nameTag.innerHTML = '';
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'name-char';
    span.textContent = ch === ' ' ? ' ' : ch;
    span.style.animationDelay = `${i * 0.15}s`;
    nameTag.appendChild(span);
  });
}
renderNameTag('爪爪');

const NAME_BASE_Y = 80;
const NAME_BASE_X = 42;
const SPEECH_GAP = 25;
const USAGE_GAP = -15;

function positionNameAndSpeech(animName) {
  const anim = ANIMS[animName];
  const oy = anim ? (anim.nameY || 0) : 0;
  const ox = anim ? (anim.nameX || 0) : 0;
  nameTag.style.bottom = (NAME_BASE_Y + oy) + 'px';
  nameTag.style.left = (NAME_BASE_X + ox) + '%';
  speechEl.style.bottom = (NAME_BASE_Y + oy + SPEECH_GAP) + 'px';
  speechEl.style.left = (NAME_BASE_X + ox) + '%';
  usageEl.style.bottom = (NAME_BASE_Y + oy + USAGE_GAP) + 'px';
  usageEl.style.left = (NAME_BASE_X + ox) + '%';
}

// --- Speech bubble ---
const SPEECH = {
  typing: [
    '寫程式中～',
    '讓我想想...',
    '嗯嗯...',
    '認真工作中！',
    '這段有點難...',
    '快好了快好了',
    '集中精神！',
    '加油加油～',
    '寫到一半了',
    '思考中...',
  ],
  clapping: [
    '完成了！',
    '太棒了！',
    '做得好～',
    '又解決一個了！',
  ],
  sunglasses: [
    '全部搞定😎',
    '收工！',
    '完美～',
  ],
  latte: [
    '謝謝咖啡☕',
    '好好喝～',
    '有咖啡就有力氣！',
  ],
  headphones: [
    '🎵～',
    '等你回來～',
    '聽歌中',
    '休息一下～',
  ],
};

let speechTimer = null;
let speechLoop = null;

function showSpeech(text) {
  speechEl.textContent = text;
  speechEl.classList.add('visible');
  clearTimeout(speechTimer);
  speechTimer = setTimeout(() => {
    speechEl.classList.remove('visible');
  }, 6000);
}

function randomSpeech(animName) {
  const pool = SPEECH[animName];
  if (!pool || pool.length === 0) return;
  showSpeech(pool[Math.floor(Math.random() * pool.length)]);
}

function startTypingSpeechLoop() {
  stopTypingSpeechLoop();
  speechLoop = setInterval(() => {
    if (currentAnim === 'typing' && fadePhase === 'none') {
      if (Math.random() < 0.5) randomSpeech('typing');
    }
  }, 35000);
}

function stopTypingSpeechLoop() {
  if (speechLoop) {
    clearInterval(speechLoop);
    speechLoop = null;
  }
}

// --- Sprite definitions ---
const ANIMS = {
  typing:     { src: 'assets/typing.png',      frameW: 320, frameH: 320, frames: 23, fps: 8, loop: true, nameY: 0, nameX: 0 },
  clapping:   { src: 'assets/clapping.png',    frameW: 256, frameH: 256, frames: 11, fps: 10, loop: false, nameY: 33, nameX: 8 },
  latte:      { src: 'assets/latte.png',       frameW: 160, frameH: 160, frames: 45, fps: 10, loop: false, repeats: 1, nameY: 0, nameX: 0 },
  sunglasses: { src: 'assets/sunglasses.png',  frameW: 128, frameH: 128, frames: 13, fps: 8, loop: false, nameY: 27, nameX: 8 },
  headphones: { src: 'assets/headphones.png',  frameW: 128, frameH: 128, frames: 6,  fps: 6, loop: false, renderSize: 108, nameY: 15, nameX: 0 },
};

// --- State machine ---
let currentAnim = 'typing';
let currentFrame = 0;
let lastFrameTime = 0;
let oneShotDone = false;
let oneShotLoops = 0;
let playState = 'playing';
let tailLoops = 0;
const ONESHOT_PLAY_COUNT = 2;

let lastEvent = { event: 'none', timestamp: 0 };
let consumedTimestamp = 0;
const IDLE_TIMEOUT = 60000;

let opacity = 1;
let fadePhase = 'none';
const FADE_OUT_SPEED = 0.035;
const FADE_IN_SPEED = 0.05;

function resolveAnimation() {
  const ev = lastEvent.event;

  if (lastEvent.timestamp > consumedTimestamp) {
    if (ev === 'sunglasses') return 'sunglasses';
    if (ev === 'coffee') return 'latte';
    if (ev === 'clap' || ev === 'stop') return 'clapping';
    if (ev === 'idle') return 'headphones';
    const age = Date.now() - lastEvent.timestamp;
    if (age > IDLE_TIMEOUT) return 'headphones';
  }

  return 'typing';
}

// --- Image loading ---
const images = {};
let loadedCount = 0;
const animKeys = Object.keys(ANIMS);

animKeys.forEach(key => {
  const img = new Image();
  img.onload = () => {
    images[key] = img;
    loadedCount++;
    if (loadedCount === animKeys.length) startLoop();
  };
  img.onerror = () => {
    console.warn('Failed to load:', ANIMS[key].src);
    loadedCount++;
    if (loadedCount === animKeys.length) startLoop();
  };
  img.src = ANIMS[key].src;
});

// --- Animation loop ---
function startLoop() {
  lastFrameTime = performance.now();
  requestAnimationFrame(tick);
  setTimeout(() => {
    showSpeech('開工了！');
    startTypingSpeechLoop();
  }, 2000);
}

function tick(now) {
  if (fadePhase === 'out') {
    opacity -= FADE_OUT_SPEED;
    if (opacity <= 0) {
      opacity = 0;
      fadePhase = 'in';
      consumedTimestamp = lastEvent.timestamp;
      currentAnim = 'typing';
      currentFrame = 0;
      lastFrameTime = now;
      oneShotDone = false;
      oneShotLoops = 0;
      playState = 'playing';
      tailLoops = 0;
      positionNameAndSpeech('typing');
      startTypingSpeechLoop();
    }
  } else if (fadePhase === 'in') {
    opacity += FADE_IN_SPEED;
    if (opacity >= 1) {
      opacity = 1;
      fadePhase = 'none';
    }
  }

  if (fadePhase === 'none') {
    const target = resolveAnimation();
    if (target !== currentAnim) {
      currentAnim = target;
      currentFrame = 0;
      lastFrameTime = now;
      oneShotDone = false;
      oneShotLoops = 0;
      playState = 'playing';
      tailLoops = 0;
      positionNameAndSpeech(target);
      randomSpeech(target);
      if (target === 'typing') {
        startTypingSpeechLoop();
      } else {
        stopTypingSpeechLoop();
      }
    }
  }

  const anim = ANIMS[currentAnim];
  if (!anim || !images[currentAnim]) {
    requestAnimationFrame(tick);
    return;
  }

  const interval = 1000 / anim.fps;
  if (now - lastFrameTime >= interval) {
    lastFrameTime = now;
    if (anim.loop) {
      currentFrame = (currentFrame + 1) % anim.frames;
    } else if (playState === 'playing') {
      if (currentFrame < anim.frames - 1) {
        currentFrame++;
      } else if (anim.tailFrom !== undefined) {
        playState = 'tailing';
        tailLoops = 0;
        currentFrame = anim.tailFrom;
      } else {
        oneShotLoops++;
        const repeats = anim.repeats || ONESHOT_PLAY_COUNT;
        if (oneShotLoops >= repeats) {
          oneShotDone = true;
          fadePhase = 'out';
        } else {
          currentFrame = 0;
        }
      }
    } else if (playState === 'tailing') {
      if (currentFrame < anim.frames - 1) {
        currentFrame++;
      } else {
        tailLoops++;
        if (tailLoops >= (anim.tailRepeats || 3)) {
          oneShotDone = true;
          fadePhase = 'out';
        } else {
          currentFrame = anim.tailFrom;
        }
      }
    }
  }

  ctx.clearRect(0, 0, 128, 128);
  ctx.globalAlpha = opacity;
  const sx = currentFrame * anim.frameW;
  const rs = anim.renderSize || 128;
  const offset = (128 - rs) / 2;
  ctx.drawImage(images[currentAnim], sx, 0, anim.frameW, anim.frameH, offset, offset, rs, rs);
  ctx.globalAlpha = 1;

  requestAnimationFrame(tick);
}

// --- IPC: receive state from main process ---
ipcRenderer.on('state-change', (event, state) => {
  lastEvent = state;
});

// --- Dynamic speech from Claude Code (via speech.json) ---
let lastDynSpeechTs = 0;
ipcRenderer.on('dynamic-speech', (event, data) => {
  if (data && data.text && data.timestamp > lastDynSpeechTs) {
    lastDynSpeechTs = data.timestamp;
    showSpeech(data.text);
  }
});

// --- Usage display ---
let lastUsageCalls = -1;
ipcRenderer.on('usage-update', (event, data) => {
  if (!data || !data.calls) return;
  const today = new Date().toISOString().slice(0, 10);
  if (data.date !== today) return;
  if (data.calls !== lastUsageCalls) {
    lastUsageCalls = data.calls;
    usageEl.textContent = '🔧 ' + data.calls;
    usageEl.classList.add('visible');
  }
});

// --- Drag support ---
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;

document.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    dragging = true;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
  }
});

document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.screenX - dragStartX;
  const dy = e.screenY - dragStartY;
  dragStartX = e.screenX;
  dragStartY = e.screenY;
  ipcRenderer.send('window-drag', { dx, dy });
});

document.addEventListener('mouseup', () => {
  dragging = false;
});
</script>
</body>
</html>
