<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body {
    width: 128px;
    height: 128px;
    overflow: hidden;
    background: transparent;
    user-select: none;
    cursor: grab;
  }
  body:active { cursor: grabbing; }
  canvas {
    width: 128px;
    height: 128px;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c" width="128" height="128"></canvas>
<script>
const { ipcRenderer } = require('electron');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Sprite definitions ---
const ANIMS = {
  typing:     { src: 'assets/typing.png',      frameW: 320, frameH: 320, frames: 23, fps: 8, loop: true },
  clapping:   { src: 'assets/clapping.png',    frameW: 256, frameH: 256, frames: 11, fps: 10, loop: false },
  latte:      { src: 'assets/latte.png',       frameW: 160, frameH: 160, frames: 45, fps: 10, loop: false, repeats: 1 },
  sunglasses: { src: 'assets/sunglasses.png',  frameW: 128, frameH: 128, frames: 13, fps: 8, loop: false, tailFrom: 12, tailRepeats: 24 },
  headphones: { src: 'assets/headphones.png',  frameW: 128, frameH: 128, frames: 6,  fps: 6, loop: true },
};

const FALLBACK = 'typing';

// --- State machine ---
// Claude Code events → animation mapping
// "tool_call" → typing (Claude is working)
// "stop"      → clapping briefly, then idle
// "coffee"    → latte animation (placeholder → clapping for now)
// "clap"      → clapping
// "none"/old  → idle (fallback to typing until headphones sprite exists)

let currentAnim = 'typing';
let currentFrame = 0;
let lastFrameTime = 0;
let oneShotDone = false;
let oneShotLoops = 0;
let playState = 'playing'; // 'playing' | 'tailing'
let tailLoops = 0;
const ONESHOT_PLAY_COUNT = 2;

// Track Claude Code activity
let lastEvent = { event: 'none', timestamp: 0 };
let consumedTimestamp = 0;
const IDLE_TIMEOUT = 60000;

// Fade transition state
let opacity = 1;
let fadePhase = 'none'; // 'none' | 'out' | 'in'
const FADE_OUT_SPEED = 0.035;
const FADE_IN_SPEED = 0.05;

function resolveAnimation() {
  const age = Date.now() - lastEvent.timestamp;
  const ev = lastEvent.event;

  if (lastEvent.timestamp > consumedTimestamp) {
    if (ev === 'sunglasses') return 'sunglasses';
    if (ev === 'coffee') return 'latte';
    if (ev === 'clap' || ev === 'stop') return 'clapping';
  }

  if (ev === 'idle' || age > IDLE_TIMEOUT) return 'headphones';

  return 'typing';
}

// --- Image loading ---
const images = {};
let loadedCount = 0;
const animKeys = Object.keys(ANIMS);

animKeys.forEach(key => {
  const img = new Image();
  img.onload = () => {
    images[key] = img;
    loadedCount++;
    if (loadedCount === animKeys.length) startLoop();
  };
  img.onerror = () => {
    console.warn('Failed to load:', ANIMS[key].src);
    loadedCount++;
    if (loadedCount === animKeys.length) startLoop();
  };
  img.src = ANIMS[key].src;
});

// --- Animation loop ---
function startLoop() {
  lastFrameTime = performance.now();
  requestAnimationFrame(tick);
}

function tick(now) {
  // Handle fade transitions
  if (fadePhase === 'out') {
    opacity -= FADE_OUT_SPEED;
    if (opacity <= 0) {
      opacity = 0;
      fadePhase = 'in';
      consumedTimestamp = lastEvent.timestamp;
      currentAnim = 'typing';
      currentFrame = 0;
      lastFrameTime = now;
      oneShotDone = false;
      oneShotLoops = 0;
      playState = 'playing';
      tailLoops = 0;
    }
  } else if (fadePhase === 'in') {
    opacity += FADE_IN_SPEED;
    if (opacity >= 1) {
      opacity = 1;
      fadePhase = 'none';
    }
  }

  // Only switch animation when not mid-fade
  if (fadePhase === 'none') {
    const target = resolveAnimation();
    if (target !== currentAnim) {
      currentAnim = target;
      currentFrame = 0;
      lastFrameTime = now;
      oneShotDone = false;
      oneShotLoops = 0;
      playState = 'playing';
      tailLoops = 0;
    }
  }

  const anim = ANIMS[currentAnim];
  if (!anim || !images[currentAnim]) {
    requestAnimationFrame(tick);
    return;
  }

  // Advance frames
  const interval = 1000 / anim.fps;
  if (now - lastFrameTime >= interval) {
    lastFrameTime = now;
    if (anim.loop) {
      currentFrame = (currentFrame + 1) % anim.frames;
    } else if (playState === 'playing') {
      if (currentFrame < anim.frames - 1) {
        currentFrame++;
      } else if (anim.tailFrom !== undefined) {
        playState = 'tailing';
        tailLoops = 0;
        currentFrame = anim.tailFrom;
      } else {
        oneShotLoops++;
        const repeats = anim.repeats || ONESHOT_PLAY_COUNT;
        if (oneShotLoops >= repeats) {
          oneShotDone = true;
          fadePhase = 'out';
        } else {
          currentFrame = 0;
        }
      }
    } else if (playState === 'tailing') {
      if (currentFrame < anim.frames - 1) {
        currentFrame++;
      } else {
        tailLoops++;
        if (tailLoops >= (anim.tailRepeats || 3)) {
          oneShotDone = true;
          fadePhase = 'out';
        } else {
          currentFrame = anim.tailFrom;
        }
      }
    }
  }

  // Draw with opacity
  ctx.clearRect(0, 0, 128, 128);
  ctx.globalAlpha = opacity;
  const sx = currentFrame * anim.frameW;
  ctx.drawImage(images[currentAnim], sx, 0, anim.frameW, anim.frameH, 0, 0, 128, 128);
  ctx.globalAlpha = 1;

  requestAnimationFrame(tick);
}

// --- IPC: receive state from main process ---
ipcRenderer.on('state-change', (event, state) => {
  lastEvent = state;
});

// --- Drag support ---
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;

document.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    dragging = true;
    dragStartX = e.screenX;
    dragStartY = e.screenY;
  }
});

document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.screenX - dragStartX;
  const dy = e.screenY - dragStartY;
  dragStartX = e.screenX;
  dragStartY = e.screenY;
  ipcRenderer.send('window-drag', { dx, dy });
});

document.addEventListener('mouseup', () => {
  dragging = false;
});
</script>
</body>
</html>
