<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2b2b2b;
    color: #e0e0e0;
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    font-size: 13px;
    overflow: hidden;
    border: 1px solid #555;
    -webkit-app-region: no-drag;
  }
  .item {
    padding: 7px 14px;
    cursor: default;
    white-space: nowrap;
  }
  .item:hover {
    background: #3d3d3d;
  }
  .sep {
    height: 1px;
    background: #555;
    margin: 3px 0;
  }
</style>
</head>
<body>
  <div class="item" data-action="coffee">☕ 給爪爪咖啡</div>
  <div class="item" data-action="clap">👏 拍拍手</div>
  <div class="item" data-action="sunglasses">😎 戴墨鏡</div>
  <div class="item" data-action="idle">🎧 聽音樂</div>
  <div class="item" data-action="tool_call">⌨ 回去打字</div>
  <div class="sep"></div>
  <div class="item" data-action="quit">❌ 離開</div>
  <script>
    const { ipcRenderer } = require('electron');
    document.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => {
        ipcRenderer.send('tray-menu-action', el.dataset.action);
      });
    });
  </script>
</body>
</html>
